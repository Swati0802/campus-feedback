<!DOCTYPE html>
<html>
<head>
  <title>Campus Feedback</title>

  <style>
    body {
      background: linear-gradient(to right, #667eea, #764ba2);
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
    }
    input, textarea {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>📝 Campus Feedback</h2>

  <input id="category" placeholder="Category">
  <input id="rating" placeholder="Rating (1–5)">
  <textarea id="feedback" placeholder="Your feedback"></textarea>

  <button onclick="sendFeedback()">Submit</button>
  <p id="msg"></p>
</div>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
   var firebaseConfig = {
  apiKey: "AIzaSyBecxw_fWVUyHfiqS-6CDQR0uZQep1D3EI",
  authDomain: "campus-feedback-92540.firebaseapp.com",
  projectId: "campus-feedback-92540",
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  function sendFeedback() {
    var category = document.getElementById("category").value;
    var rating = document.getElementById("rating").value;
    var feedback = document.getElementById("feedback").value;

    db.collection("feedbacks").add({
      category: category,
      rating: rating,
      feedback: feedback,
      time: new Date()
    }).then(function () {
      document.getElementById("msg").innerText =
        "✅ Feedback submitted!";
    }).catch(function (error) {
      alert("Error: " + error);
    });
  }
</script>

</body>
</html>
